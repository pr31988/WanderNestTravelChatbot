<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>My Streamlit App</title>
    <link rel="stylesheet" href="https://jsdelivr.net" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://jsdelivr.net";
      mount(
        {
          requirements: ["pandas", "numpy"], // Add your PyPI packages here
          entrypoint: "src/app.py",
          files: {
            "src/app.py": {
              url: "./src/app.py",
            },
            // Add any other helper files or local datasets your app imports.
            // "src/utils.py": { url: "./src/utils.py" },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
